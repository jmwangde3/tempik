name = "tempik"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Set workers_dev to false when using your own domain
workers_dev = false

# ---- D1 Database ----
# Step 1: run `npx wrangler d1 create tempik-db`
# Step 2: copy the database_id here
[[d1_databases]]
binding = "DB"
database_name = "tempik-db"
database_id = ""

# ---- Email Worker ----
# No config block is needed: exporting email() from src/index.ts is enough, and
# the Email Routing rule (Catch-all -> Send to Worker) is set in the dashboard.
# A `[email]` table here is ignored by wrangler ("Unexpected fields: email").

# ---- Custom domain routes ----
# CHANGE THIS to your own domain
[[routes]]
pattern = "tempik.YOURDOMAIN.com"
custom_domain = true

# ---- Environment variables ----
# CHANGE THESE to your own domain
[vars]
APP_NAME = "Tempik"
MAIL_DOMAIN = "YOURDOMAIN.com"
WEB_HOST = "tempik.YOURDOMAIN.com"
# Comma-separated MAIL_DOMAIN is supported, e.g. "a.com,b.com"
# Inboxes one session may hold at once.
MAX_INBOXES_PER_SESSION = "50"
# Days before messages/inboxes/sessions are purged by the cron below.
RETENTION_DAYS = "7"

# ---- Retention sweep (UTC) ----
[triggers]
crons = ["17 3 * * *"]

# ---- Static assets (web frontend) ----
[assets]
directory = "./src/web"

# ---- Observability ----
[observability]
enabled = true
